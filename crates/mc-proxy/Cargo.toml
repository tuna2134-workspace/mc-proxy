[package]
name = "mc-proxy"
description = "A Velocity-compatible Minecraft reverse proxy on top of tokio-fstack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Use the F-Stack (DPDK) socket backend instead of kernel sockets.
fstack = ["tokio-fstack/fstack"]

[dependencies]
tokio-fstack = { path = "../tokio-fstack" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"
aes = "0.8"
rsa = { version = "0.9", features = ["sha1"] }
base64 = "0.22"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["sha1"] }
rand = "0.8"
uuid = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
